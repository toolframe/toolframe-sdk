name: Publish Python package

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-tag:
    name: Require the project version tag
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out the triggering revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14.7'
      - name: Validate the selected tag
        run: python scripts/check_release_tag.py "$GITHUB_REF_TYPE" "$GITHUB_REF_NAME"

  validate:
    name: Validate the release revision
    needs: release-tag
    uses: ./.github/workflows/ci.yml

  publish:
    name: Publish to PyPI
    needs: [release-tag, validate]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    concurrency:
      group: sdk-publish-pypi
      cancel-in-progress: false
    environment:
      name: pypi
      url: https://pypi.org/p/toolframe-sdk
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download distributions validated in this run
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sdk-distributions-ubuntu-24.04-${{ github.sha }}
          path: dist/
      - name: Publish with a Trusted Publisher
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist/
          repository-url: https://upload.pypi.org/legacy/
